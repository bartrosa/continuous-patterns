  output.evolution_dt: 50.0
  physics.D_c: 1.0
  physics.k_rxn: 0.5
  physics.c_sat: 0.2
  physics.c_0: 1.0
  physics.c_ostwald: 0.30
  physics.w_ostwald: 0.05
  physics.bc_right: dirichlet
  time.dt_safety: 0.4

block_overrides:
  B:
    output.evolution_dt: 25.0
  C:
    output.evolution_dt: 100.0
