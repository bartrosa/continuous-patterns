    - run_label: E16_D1C_g4
      display_label: D1C_g4
      variant_banner: "Closed cavity | supersaturation eaten in one pass, no bands"
      mechanism_class: CH closed cavity
      model: slab_twophase
      cavity_row: true
      base_config: experiments/canonical/slab_twophase/baseline.yaml
      overrides:
        physics.demixing: ch
        physics.gamma: 4.0
        physics.kappa: 0.5
        physics.M0: 1.0
        physics.bc_right: noflux
        physics.c_sat: 0.05
        physics.c_ostwald: 0.30
        physics.w_ostwald: 0.05
        initial.c_init: 0.45
        geometry.L: 100.0
        geometry.n: 256
        time.T: 40000.0
        time.snapshot_every: 10000
