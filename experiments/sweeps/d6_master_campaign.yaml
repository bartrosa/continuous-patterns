comparison:
  name: d6_master_campaign
  figure_out: figure_master_comparison.png
  figure_banners: true
  figure_banner_layout: dedicated
  campaign_self_contained: true
  figure_subtitle: "Silica banding: Heaney kinetic clock vs Cahn-Hilliard demixing, across supply geometries."
  footer_note: "D6 self-contained fresh campaign; D6H moving-front winner ingested locally"
  d6h_sweep_dir: PLACEHOLDER_D6H_SWEEP
  d6_verdict_path: PLACEHOLDER_D6_VERDICT
  experiments:
    - run_label: E1_Heaney_open
      display_label: E1 Heaney open
      variant_banner: "Open slab, fixed gap | the clock works (115 bands)"
      mechanism_class: Heaney kinetic clock
      model: slab_kinetic
      base_config: experiments/canonical/slab_kinetic/baseline.yaml
      overrides:
        physics.c1: 0.40
        physics.c2: 0.26
        time.T: 20.0
      regression:
        n_transitions: [110, 120]
    - run_label: E2_Heaney_control
      display_label: E2 Heaney control (poster c1/c2)
      variant_banner: "Poster c1/c2 control | marginal (≈1 band)"
      mechanism_class: Heaney kinetic clock
      model: slab_kinetic
      base_config: experiments/canonical/slab_kinetic/baseline.yaml
      overrides:
        physics.c1: 0.49
        physics.c2: 0.10
        time.T: 20.0
      regression:
        n_transitions_max: 1
    - run_label: E3_Heaney_closed
      display_label: E3 Heaney closed
      variant_banner: "Closed cavity | block -> bands -> block"
      mechanism_class: Heaney kinetic clock
      model: slab_kinetic
      base_config: experiments/canonical/slab_kinetic/baseline.yaml
      e3_pairs:
        - {c1: 0.70, c2: 0.66, label: "0.70/0.66"}
        - {c1: 0.60, c2: 0.56, label: "0.60/0.56"}
        - {c1: 0.50, c2: 0.46, label: "0.50/0.46"}
    - run_label: E9_Heaney_movingfront
      display_label: E9 Heaney moving front
      variant_banner: "Moving front (this work) | pending verdict"
      mechanism_class: Heaney moving front (hysteresis)
      model: slab_twophase
      ingest: d6h_best
    - run_label: E10_D1A_v0p010_f30
      display_label: D1A_v0p010_f30
      variant_banner: "Driven front, eutectic | lambda shrinks with v (v^-1/2)"
      mechanism_class: CH driven eutectic
      model: slab_twophase
      base_config: experiments/canonical/slab_twophase/baseline.yaml
      overrides:
        physics.run_mode: driven
        physics.demixing: ch
        physics.gamma: 4.0
        physics.kappa: 0.5
        physics.M0: 1.0
        physics.v_front: 0.010
        physics.f_chalcedony: 0.30
        geometry.L: 100.0
        geometry.n: 256
        time.T: 11000.0
    - run_label: E11_D1A_v0p020_f30
