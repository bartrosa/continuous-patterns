# Mini-sweep 10×10 over (c1, c2) at fixed Da=1, κ=3 (oscillation-window phenomenology).

sweep:
  name: slab_kinetic_oscillation_window
  nested_results: true
  base_config: experiments/canonical/slab_kinetic/baseline.yaml
  description: |
    Dense 10×10 sweep over (c1, c2) at fixed Da=1, κ=3 to map oscillation
    density inside the analytical oscillation window 1/(1+κDa) < c2 < c1 < 1/(1+Da)
    → 0.25 < c2 < c1 < 0.50.
  axes:
    - name: c1
      path: physics.c1
      values: [0.27, 0.30, 0.33, 0.36, 0.39, 0.42, 0.45, 0.47, 0.49, 0.50]
    - name: c2
      path: physics.c2
      values: [0.25, 0.27, 0.29, 0.31, 0.34, 0.37, 0.40, 0.43, 0.46, 0.49]

overrides:
  geometry.n: 200
  time.T: 20.0
  time.snapshot_every: 200
  physics.Da: 1.0
  physics.kappa: 3.0
