# Cartesian sweep: Da × κ × threshold pairs (c1, c2 merged into physics).
# 11 pairs × 4 × 4 = 176 runs (user list contains 11 distinct threshold pairs).

sweep:
  name: slab_kinetic_parametric
  nested_results: true
  base_config: experiments/canonical/slab_kinetic/baseline.yaml
  axes:
    - name: Da
      path: physics.Da
      values: [0.5, 1.0, 2.0, 5.0]
    - name: kappa
      path: physics.kappa
      values: [1.5, 3.0, 5.0, 10.0]
    - name: threshold_pair
      merge_into: physics
      values:
        # Poster replication (Szymczak–Kossacki)
        - c1: 0.49
          c2: 0.10
        - c1: 0.40
          c2: 0.26
        - c1: 0.25
          c2: 0.10
        - c1: 0.50
          c2: 0.15
        - c1: 0.33
          c2: 0.20
        # Expected to oscillate (high c2)
        - c1: 0.40
          c2: 0.30
        - c1: 0.45
          c2: 0.30
        - c1: 0.45
          c2: 0.35
        - c1: 0.50
          c2: 0.40
        # Control — expected stuck / low transitions
        - c1: 0.30
          c2: 0.05
        - c1: 0.40
          c2: 0.15

overrides:
  time.T: 20.0
  time.snapshot_every: 200
