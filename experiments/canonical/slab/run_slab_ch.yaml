experiment:
  name: run_slab_ch
  model: slab_reactive
  seed: 42
  description: |
    Slab geometry CH with parameters copied from experiments/canonical/medium_pinning.yaml.
    Tests whether γ-immiscibility produces banding without circular geometry.

geometry:
  type: slab
  L: 100.0
  n: 512
  eps_scale: 2.0
  rim_width_px: 2
  rim_left_width_px: 2

physics:
  W: 1.0
  gamma: 4.0
  kappa_x: 0.5
  kappa_y: 0.5
  M_m: 0.01
  M_c: 1.0
  D_c: 1.0
  k_rxn: 0.5
  c_sat: 0.2
  c_0: 1.0
  c_ostwald: 0.6
  w_ostwald: 0.1
  lambda_bar: 10.0
  eta_wall: 0.0
  use_ratchet: true
  phi_m_ratchet_low: 0.3
  phi_m_ratchet_high: 0.5
  phases:
    moganite:
      potential: double_well
      potential_kwargs: {W: 1.0}
      mobility: 0.01
      rho: 1.0
      psi_sign: 1.0
      active: true
    chalcedony:
      potential: double_well
      potential_kwargs: {W: 1.0}
      mobility: 1.0
      rho: 1.0
      psi_sign: -1.0
      active: true

stress:
  mode: none
  sigma_0: 0.0
  stress_coupling_B: 0.0
  stress_eps_factor: 3.0

time:
  dt: 0.01
  T: 20000.0
  snapshot_every: 500

output:
  save_final_state: true
  save_evolution: true
  evolution_dt: 200.0
  record_evolution_gif: true
  gif_max_frames: 100
  gif_fps: 10

initial:
  c_init: 0.2
  phi_m_init: 0.0
  phi_c_init: 0.0
  phi_noise_amplitude: 0.01
  phi_m_wall_layer: 0.5
  phi_m_wall_width_px: 2
